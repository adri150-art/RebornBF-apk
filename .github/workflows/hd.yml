name: Remaster HD de l'interface
on:
  workflow_dispatch:
    inputs:
      list:
        description: Liste des images (hd/test.txt ou hd/pieces.txt)
        default: hd/test.txt
permissions:
  contents: write
jobs:
  hd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Outils
        run: |
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet spandrel pillow numpy
          curl -fsSL -o model.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
      - name: Agrandir
        env:
          KEEP_ORIG: ${{ inputs.list == 'hd/test.txt' && '1' || '' }}
        run: python3 tools/hd_upscale.py ${{ inputs.list }} out
      - name: Publier sur la branche hd-assets
        run: |
          cd out
          git init -q && git checkout -q -b hd-assets
          git config user.email bot@example.com && git config user.name bot
          git add -A && git commit -qm "Interface de combat en HD"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" hd-assets
