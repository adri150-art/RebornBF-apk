name: Construire les applis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Logo du jeu pour la version publique
        run: |
          pip install --quiet pillow
          python3 tools/make_public_icon.py

      - name: Compiler
        run: gradle :app:assembleRelease :public:assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: |
          cp app/build/outputs/apk/release/app-release.apk RebornBF.apk
          cp public/build/outputs/apk/release/public-release.apk BFReborn-Android-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RebornBF-apk
          path: |
            RebornBF.apk
            BFReborn-Android-v1.0.*.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reborn BF 1.0.${{ github.run_number }}
          body: RebornBF.apk = appli perso avec bots · BFReborn-Android-v1.0.*.apk = le jeu tel quel, sans ajouts.
          files: |
            RebornBF.apk
            BFReborn-Android-v1.0.*.apk
          make_latest: true

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copier les scripts partagés avec Android
        shell: bash
        run: mkdir -p windows/scripts && cp app/src/main/assets/scripts/*.js windows/scripts/

      - name: Installer
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Construire
        working-directory: windows
        run: npx electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: RebornBF-Windows
          path: windows/dist/RebornBF-Setup.exe

      - name: Ajouter à la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: windows/dist/RebornBF-Setup.exe
