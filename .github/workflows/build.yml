name: Construire les applis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Logo du jeu pour la version publique
        continue-on-error: true
        run: |
          # L'icône de l'onglet du site (favicon) : petit dessin en pixels, agrandi sans flou
          curl -fsSL https://rebornbf.com/favicon.ico -o /tmp/fav.ico
          idx=$(identify -format "%p %w\n" /tmp/fav.ico | sort -k2 -n | tail -1 | cut -d' ' -f1)
          convert "/tmp/fav.ico[$idx]" -background none /tmp/fav.png
          R=public/src/main/res
          for s in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${s%%:*}; n=${s##*:}
            convert /tmp/fav.png -filter point -resize ${n}x${n} $R/mipmap-$d/ic_launcher.png
          done
          # Icône adaptative : le dessin au centre, fond de la même couleur que son bord
          bg=$(convert /tmp/fav.png -format "%[hex:p{1,1}]" info: | cut -c1-6)
          convert /tmp/fav.png -filter point -resize 336x336 -background none -gravity center -extent 432x432 $R/drawable-nodpi/ic_fg.png
          sed -i "s|<color name=\"ic_bg\">#[0-9A-Fa-f]*</color>|<color name=\"ic_bg\">#$bg</color>|" $R/values/res.xml
          grep ic_bg $R/values/res.xml

      - name: Compiler
        run: gradle :app:assembleRelease :public:assembleRelease --no-daemon --stacktrace

      - name: Renommer
        run: |
          cp app/build/outputs/apk/release/app-release.apk RebornBF.apk
          cp public/build/outputs/apk/release/public-release.apk BF-Reborn-public.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RebornBF-apk
          path: |
            RebornBF.apk
            BF-Reborn-public.apk

      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reborn BF 1.0.${{ github.run_number }}
          body: RebornBF.apk = appli perso avec bots · BF-Reborn-public.apk = le jeu tel quel, sans ajouts.
          files: |
            RebornBF.apk
            BF-Reborn-public.apk
          make_latest: true

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copier les scripts partagés avec Android
        shell: bash
        run: mkdir -p windows/scripts && cp app/src/main/assets/scripts/*.js windows/scripts/

      - name: Installer
        working-directory: windows
        run: npm install --no-audit --no-fund

      - name: Construire
        working-directory: windows
        run: npx electron-builder --win nsis --x64 --publish never --config.extraMetadata.version=1.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: RebornBF-Windows
          path: windows/dist/RebornBF-Setup.exe

      - name: Ajouter à la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: windows/dist/RebornBF-Setup.exe
