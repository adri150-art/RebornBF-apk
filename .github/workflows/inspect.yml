name: Analyse du jeu (temporaire)
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger le code du jeu
        run: |
          mkdir -p js && cd js
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Mobile Safari/537.36"
          for p in / /battle /home; do curl -fsSL -A "$UA" "https://rebornbf.com$p" >> pages.html || true; done
          grep -oE '/_next/static/[^"'"'"' ]+\.js' pages.html | sort -u > list.txt
          wc -l list.txt
          while read u; do curl -fsSL -A "$UA" "https://rebornbf.com$u" -o "$(echo $u | tr '/' '_')" || true; done < list.txt
          # Morceaux chargés plus tard (chunks) : on suit les références
          for i in 1 2; do
            grep -ohE 'static/chunks/[A-Za-z0-9._/-]+\.js' *.js | sort -u | while read c; do f="$(echo /_next/$c | tr '/' '_')"; [ -f "$f" ] || curl -fsSL -A "$UA" "https://rebornbf.com/_next/$c" -o "$f" || true; done
          done
          ls | wc -l; du -sh .
      - uses: actions/upload-artifact@v4
        with:
          name: game-js
          path: js/
