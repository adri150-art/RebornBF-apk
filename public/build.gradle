plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

// Version « publique » : uniquement le jeu tel que le site le propose, sans bots ni ajouts.
// Identifiant différent de l'appli perso : les deux s'installent côte à côte.
android {
    namespace 'be.adriano.bfreborn'
    compileSdk 34

    defaultConfig {
        applicationId 'be.adriano.bfreborn'
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('../app/rebornbf.jks')
            storePassword 'rebornbf-app'
            keyAlias 'rebornbf'
            keyPassword 'rebornbf-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
}
